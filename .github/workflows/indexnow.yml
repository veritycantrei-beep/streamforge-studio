name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '9f3a1c7d5e2b4a6c8d0f123456789abc.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for static deploy
        run: sleep 20
      - name: Notify IndexNow
        run: |
          KEY='9f3a1c7d5e2b4a6c8d0f123456789abc'
          urls=(
            'https://streamforge-studio.onrender.com/'
            'https://streamforge-studio.onrender.com/youtube-thumbnail-designer.html'
            'https://streamforge-studio.onrender.com/free-thumbnail-audit.html'
          )
          for u in "${urls[@]}"; do
            enc=$(python -c "import urllib.parse; print(urllib.parse.quote('''$u''', safe=''))")
            curl -fsS "https://api.indexnow.org/indexnow?url=${enc}&key=${KEY}" || true
          done
