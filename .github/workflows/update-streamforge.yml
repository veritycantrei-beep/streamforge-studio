name: Update StreamForge site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-streamforge.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portfolio
        run: python scripts/patch_niche.py

      - name: Commit update
        run: |
          git config user.name "StreamForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add business podcast true-crime and tech portfolio concepts"
            git push
          fi
