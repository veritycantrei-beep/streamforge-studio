name: Update StreamForge site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-streamforge.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download prepared site
        run: |
          curl -L "https://cdn.creativeclaw.co/u/c955981b/zips/3332515e-3156-41e8-bce3-b7501fc851c8.zip" -o /tmp/site.zip
          unzip -o /tmp/site.zip -d /tmp/site
          cp /tmp/site/streamforge_v3.html index.html
      - name: Commit update
        run: |
          git config user.name "StreamForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Expand portfolio with new concept packs"
            git push
          fi
